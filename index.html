<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>La Petite Fadette – Lire et comprendre</title>
<style>
@font-face{font-family:Lexend;src:url(assets/fonts/lexend-latin-400-normal.woff2) format('woff2');font-weight:400}
@font-face{font-family:Lexend;src:url(assets/fonts/lexend-latin-600-normal.woff2) format('woff2');font-weight:600}
:root{--bg:#f4ecd8;--ink:#2b2118;--acc:#8a4b2a;--ok:#2f7d4f;--ko:#b3402f;--res:#e3eef7}
*{box-sizing:border-box}body{margin:0;background:#2f261e;font-family:Georgia,serif;color:var(--ink)}
#app{max-width:1280px;margin:0 auto;min-height:100vh;background:var(--bg);display:flex;flex-direction:column;box-shadow:0 0 40px #0008}
header{height:44px;padding:0 14px;background:var(--acc);color:#fff;display:flex;justify-content:space-between;align-items:center;font-size:.9rem;position:sticky;top:0;z-index:5}
header button{font:inherit;font-size:.8rem;background:#fff2;color:#fff;border:1px solid #fff9;border-radius:14px;padding:3px 12px;margin-left:10px;cursor:pointer}header button[aria-pressed=true]{background:#fff;color:var(--acc)}
#rot{display:none;background:#fff3c4;font:.85rem Arial;padding:6px 10px;cursor:pointer}
@media (max-width:600px) and (orientation:portrait){#rot{display:block}}
#wrap{flex:1}#right{padding:16px}
#stage{display:none;position:relative;width:100%;max-width:calc(62vh*1.7778);margin:0 auto;overflow:hidden;background:#cfe0c3}
#stage.on{display:block}#stage .sp{position:absolute}#stage .full{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:cover}
#txt .extrait{margin:12px 0 0}
@media (min-width:640px) and (orientation:landscape),(min-width:900px){
 #wrap.quiz{display:flex;height:calc(100vh - 44px);overflow:hidden}
 #wrap.quiz #left{flex:0 0 46%;overflow:auto;padding:12px;border-right:1px solid #d8c9a6}#wrap.quiz #right{flex:1;overflow:auto}#wrap.quiz #stage{max-width:100%}}
.extrait{background:#fffaf0;border-left:5px solid var(--acc);padding:12px 14px;margin:0 0 14px;font-size:1.1rem;line-height:1.65;border-radius:0 8px 8px 0;box-shadow:0 1px 4px #0002}
.extrait small,.resume small{display:block;color:var(--acc);font-style:italic;margin-bottom:6px;font-size:.8rem}
.mot{border-bottom:2px dotted var(--acc);cursor:pointer}.note{margin-top:8px;padding:8px 10px;background:#fff3c4;border-radius:8px;font:.95rem/1.4 Arial,sans-serif}
.resume{background:var(--res);border:2px dashed #5b8bb0;border-radius:10px;padding:12px 14px;font-family:Arial,sans-serif;font-size:1.05rem;line-height:1.55}
.resume small{font-style:normal;font-weight:bold;color:#2d5f86;text-transform:uppercase;letter-spacing:.05em}
.perdu{background:#3a3030;color:#f1e6d6;border-radius:10px;padding:12px 14px;font-family:Arial,sans-serif;line-height:1.5}.perdu small{display:block;color:#e8a58f;font-weight:bold;text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px}
.comp{font:bold .75rem Arial;color:var(--acc);text-transform:uppercase;letter-spacing:.06em}
h2{font-size:1.2rem;margin:4px 0 12px;line-height:1.4}button,.opt{font:inherit;cursor:pointer}
.opt{display:block;width:100%;text-align:left;margin:8px 0;padding:12px;border:2px solid #c9b48f;border-radius:10px;background:#fff}
.opt:hover:not(:disabled){border-color:var(--acc)}.opt.bad{background:#f6d9d3;border-color:var(--ko)}.opt.good{background:#d7efdf;border-color:var(--ok)}
.imgs{display:flex}.imgs .opt{text-align:center;padding:6px;margin-right:12px}.face{height:200px;overflow:hidden}.face img{width:100%}.flip{transform:scaleX(-1)}
.seg{cursor:pointer;padding:2px 1px;border-radius:4px}.seg:hover{background:#f3dc9d}.seg.bad{background:#f6d9d3}.seg.good{background:#d7efdf}
.btn{background:var(--acc);color:#fff;border:0;border-radius:10px;padding:10px 18px;margin:10px 8px 0 0}.btn.alt{background:#fff;color:var(--acc);border:2px solid var(--acc)}.btn:disabled{opacity:.45}
input[type=text]{font:inherit;padding:10px;border:2px solid #c9b48f;border-radius:8px;width:60%}
.fb{margin-top:10px;padding:10px;border-radius:8px;font-family:Arial,sans-serif}.fb.bad{background:#f6d9d3}.fb.good{background:#d7efdf}
.hint{background:#fff3c4;margin-top:8px;padding:8px 10px;border-radius:8px;font-family:Arial,sans-serif;display:flex;align-items:center}.hint img{height:64px;flex:none;margin-right:10px}
.bar{height:8px;background:#e3d6b8;border-radius:4px;overflow:hidden;margin:6px 0}.bar i{display:block;height:100%;background:var(--ok)}
#accueil{position:relative;width:100%;max-width:calc(70vh*1.7778);margin:0 auto;background:#f0e2b8 center/cover no-repeat;border-radius:10px;overflow:hidden}
#accueil .in{position:absolute;left:0;right:0;bottom:3%;text-align:center;padding:0 12px}#accueil h1{margin:0 0 2px;font-size:clamp(1.2rem,4.5vw,2.3rem);text-shadow:0 1px 0 #fff8}
.cap{font-size:1.05rem}
body.dys,body.dys *{font-family:Lexend,Verdana,sans-serif!important}
body.dys #app{letter-spacing:.045em;word-spacing:.2em;line-height:1.95;font-size:1.1rem;background:#fbf7ea;color:#262626}
body.dys #stage{display:none!important}body.dys #right{max-width:78ch}
body.dys #wrap.quiz{display:block;height:auto;overflow:visible}body.dys #wrap.quiz #left{border:0;overflow:visible;padding:0 16px}body.dys #wrap.quiz #right{overflow:visible}
body.dys .extrait,body.dys .resume,body.dys .perdu{font-size:1.15rem;line-height:2.05;max-width:70ch;text-align:left}
body.dys .opt{line-height:1.8;padding:14px}
</style></head><body><div id="app">
<header><span id="ttl">La Petite Fadette – Lire et comprendre</span><span><span id="prog"></span><button id="dysb" aria-pressed="false" onclick="dys(!save.dys)">Mode DYS</button></span></header>
<div id="rot" onclick="this.style.display='none'">📱 Pour plus de confort, tourne ton téléphone en mode paysage (touche ici pour fermer). Tu peux toujours faire défiler l'écran.</div>
<div id="wrap" class="read"><section id="left"><div id="stage"></div><div id="txt"></div></section><main id="right"><div id="panel"></div></main></div></div>
<script src="data/episodes.js"></script><script>if(/[?&]test=1/.test(location.search))document.write('<script src="data/episode_test.js"><\/script>')</script><script src="data/defaites.js"></script><script src="assets/sprites_meta.js"></script>
<script>
const $=s=>document.querySelector(s),P=$('#panel'),S=$('#stage'),T=$('#txt'),W=$('#wrap');
const KEY='vct_save_v1';let save=(()=>{try{return JSON.parse(localStorage.getItem(KEY))||{}}catch(e){return{}}})();
const store=()=>{try{localStorage.setItem(KEY,JSON.stringify(save))}catch(e){}if(window.VCT_SYNC)try{VCT_SYNC(save)}catch(e){}};
const norm=s=>s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]/g,'');
const COMP={prelever:'Prélever une information',reformuler:'Reformuler, comprendre un mot',inferer:'Comprendre ce qui n\'est pas dit',justifier:'Justifier avec le texte',point:'Comprendre le choix de l\'auteur'};
const ERR={hors:"Cette idée n'est pas dans l'extrait. Relis-le : peux-tu montrer où c'est écrit ?",contresens:"Attention : ce que tu proposes dit presque le contraire du texte.",sur:"C'est aller trop loin : le texte ne dit pas cela.",sous:"C'est vrai, mais incomplet : il manque une partie de la réponse.",vraihq:"C'est écrit dans le texte, mais cela ne répond pas à la question posée.",litteral:"Tu as lu l'image au sens propre. Ici, l'auteur fait une comparaison.",gaucheDroite:"Tu as peut-être confondu la gauche du garçon et la gauche de l'écran.",ailleurs:"Ce morceau ne répond pas à la question.",saisie:"Ce n'est pas le bon mot. Relis la phrase."};
const TAUNT=["Tu veux un coup de main ? Bon… écoute bien.","Encore perdu ? Allez, un deuxième indice.","Dernier indice, et je ne te donne toujours pas la réponse !"];
const MAXJ=3,EXT=['png','jpg','jpeg','jfif','webp'];
const MULTI=['cadet_caillaud','pere_barbeau','mere_barbeau','mere_fadet','mere_sagette','pere_caillaud'];
const persoOf=b=>MULTI.find(m=>b.startsWith(m))||b.split('_')[0];
function img(base,cls,folder){const i=new Image();let k=0;i.className=cls||'';const t=()=>{i.src=`assets/${folder||'sprites/'+persoOf(base)}/${base}.${EXT[k++]}`};i.onerror=()=>{if(k<EXT.length)t();else i.remove()};t();return i}
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const el=(h,c)=>{const d=document.createElement('div');if(c)d.className=c;d.innerHTML=h||'';return d};
function btn(txt,fn,alt){const b=document.createElement('button');b.className='btn'+(alt?' alt':'');b.textContent=txt;b.onclick=fn;return b}
let ep,si,cur;
/* ---------- décor et sprites à l'échelle (sprites_meta : adulte de 172 cm = 80 % de la hauteur) ---------- */
function drawStage(sc){S.innerHTML='';S.style.backgroundImage='';const on=sc&&(sc.sprites||sc.decor||sc.album);S.className=on?'on':'';if(on)S.style.height=Math.round(S.clientWidth*.5625)+'px';if(!on)return;
 if(sc.decor){const d=img(sc.decor,'full','decors');S.appendChild(d)}
 if(sc.album){S.appendChild(img(sc.album,'full','album'));return}
 const W=S.clientWidth,H=S.clientHeight,ppc=H*.8/172;
 (sc.sprites||[]).forEach(s=>{const m=(window.SPRITES_META||{})[s.img],i=img(s.img,'sp');let h,w,bot,cx;
  if(m){const k=m.cm_per_px*ppc;h=m.canvas[1]*k;w=m.canvas[0]*k;bot=-(m.canvas[1]-m.foot_y)*k;cx=m.center_x*k}else{h=H*.8;w=h*.67;bot=0;cx=w/2}
  if(s.flip){cx=w-cx;i.style.transform='scaleX(-1)'}
  const X=(s.x!=null?s.x:s.side==='right'?76:s.side==='center'?50:24)/100*W;
  i.style.cssText+=`;height:${h}px;width:${w}px;left:${X-cx}px;bottom:${bot+H*.03}px`;S.appendChild(i)})}
const isQ=sc=>['resume','texte','album','defaite'].indexOf(sc.type)<0;
function vis(sc){if(sc.decor||sc.sprites||sc.album)return sc;for(let k=si-1;k>=0;k--){const x=ep.scenes[k];if(x.ref===sc.ref&&(x.decor||x.sprites||x.album))return x}return null}
const redraw=()=>{if(cur&&ep)drawStage(isQ(cur)?vis(cur):cur);else{const a=$('#accueil');if(a)a.style.height=Math.round(a.clientWidth*.5625)+'px'}};
window.addEventListener('resize',redraw);
const fmt=t=>t.replace(/\[\[([^|\]]+)\|([^\]]+)\]\]/g,(m,a,b)=>'<span class="mot" data-d="'+b.replace(/"/g,'&quot;')+'">'+a+'</span>');
document.addEventListener('click',e=>{const m=e.target.closest&&e.target.closest('.mot');if(!m)return;const b=m.closest('.extrait');let n=b.querySelector('.note');if(!n){n=document.createElement('div');n.className='note';b.appendChild(n)}n.innerHTML='<b>'+m.textContent+'</b> : '+m.dataset.d});
function dys(v){save.dys=!!v;document.body.classList.toggle('dys',!!v);$('#dysb').setAttribute('aria-pressed',!!v);store();redraw()}
/* ---------- accueil ---------- */
function home(){cur=null;drawStage(null);W.className='read';T.innerHTML='';$('#prog').textContent='';$('#ttl').textContent='La Petite Fadette – Lire et comprendre';
 P.innerHTML='';const a=el('','');a.id='accueil';a.style.backgroundImage="url('assets/ui/ecran_accueil.jpg')";
 const n=el('<h1>La Petite Fadette</h1><div>Lire et comprendre un roman de George Sand</div>');n.className='in';a.appendChild(n);P.appendChild(a);a.style.height=Math.round(a.clientWidth*.5625)+'px';
 const L=el('');EPISODES.forEach((e,k)=>{const d=save.done&&save.done[e.id],pos=(save.pos||{})[e.id]||0;
  L.appendChild(btn(e.titre+(e.tuto?' (tuto)':'')+(d?' ✓':pos?' (reprendre)':''),()=>start(e,d?0:pos)))});
 const v=Object.keys(save.def||{}).length;if(v)L.appendChild(el(`<p><small>Fins perdues découvertes : ${v} / ${Object.keys(DEFAITES).length}</small></p>`));P.appendChild(L)}
function start(e,pos){ep=e;si=pos||0;if(!ep.seul){save.jet=save.jet||{};if(pos===0)save.jet[ep.id]=0}go()}
function go(){const sc=ep.scenes[si];if(!sc)return bilan();cur=sc;
 if(!ep.seul){save.pos=save.pos||{};save.pos[ep.id]=si;store()}
 $('#prog').textContent=`${si+1} / ${ep.scenes.length}`+(ep.tuto?' · tuto':'');const q=isQ(sc);W.className=q?'quiz':'read';drawStage(q?vis(sc):sc);P.innerHTML='';T.innerHTML='';window.scrollTo(0,0);
 ({resume:rResume,texte:rTexte,album:rAlbum,defaite:rDefaite}[sc.type]||rQ)(sc)}
const next=()=>{si++;go()};
const box=x=>`<div class="extrait"><small>Texte de ${x.src}</small>${fmt(x.t)}</div>`;
function rResume(sc){P.innerHTML=`<div class="resume"><small>Résumé du jeu – ce n'est pas le texte de Sand</small>${sc.t}</div>`;P.appendChild(btn('Continuer',next))}
function rTexte(sc){P.innerHTML=box(ep.extraits[sc.ref]);P.insertAdjacentHTML('beforeend','<p><em>Lis bien. Les questions arrivent ensuite, et tu pourras relire le texte.</em></p>');P.appendChild(btn('J\'ai lu, je continue',next))}
function rAlbum(sc){const x=sc.ref?ep.extraits[sc.ref]:sc;P.innerHTML=`<div class="extrait cap"><small>Texte de ${x.src}</small>${fmt(x.t)}</div>`;P.appendChild(btn('Continuer',next))}
/* ---------- fin perdue : image + texte du jeu, puis reprise au dernier texte lu ---------- */
function rDefaite(sc){const d=DEFAITES[sc.id];S.innerHTML='';S.className='on';S.appendChild(img(d.img,'full','defaites'));
 P.innerHTML=`<div class="perdu"><small>Fin perdue – ${d.titre}</small>${d.t}</div>`;
 P.appendChild(btn('Reprendre la lecture',()=>{ep.scenes.forEach((s,n)=>{if(n>=sc.retour&&s.id)delete save.res[ep.id+':'+s.id]});store();si=sc.retour;go()}))}
function perdre(id){save.def=save.def||{};save.def[id]=1;store();let k=si;while(k>0&&ep.scenes[k].type!=='texte')k--;rDefaite({id:id,retour:k})}
/* ---------- questions ---------- */
function rQ(sc){const id=ep.id+':'+sc.id,r=save.res=save.res||{};r[id]=r[id]||{c:sc.comp,t:0,h:0,e:[]};const R=r[id];
 const tuto=ep.tuto||ep.seul,jet=()=>MAXJ-((save.jet||{})[ep.id]||0);
 if(sc.type!=='clic')T.innerHTML=box(ep.extraits[sc.ref]);
 P.insertAdjacentHTML('beforeend',`<div class="comp">${COMP[sc.comp]}</div><h2>${sc.q}</h2>`);
 const A=el(),F=el(),H=el(),N=el();P.append(A,F,H,N);let over=false,hn=0;
 let hb=null;
 if(!tuto&&sc.aide){hb=btn('',()=>{if(hn>=sc.aide.length||jet()<=0)return;
   const pic=img('sauteriot_12_allie_indice'+(hn+1),'', 'portraits/sauteriot');H.insertAdjacentHTML('beforeend',`<div class="hint"><span>${TAUNT[hn]||''}<br><b>${hn+1}.</b> ${sc.aide[hn]}</span></div>`);H.lastChild.insertBefore(pic,H.lastChild.firstChild);
   if(hn===2)R.h3=1;hn++;R.h++;save.jet[ep.id]=(save.jet[ep.id]||0)+1;store();lab()},1);
  const lab=()=>{hb.textContent=`💡 Sauteriot (${jet()} jeton${jet()>1?'s':''})`;hb.disabled=hn>=sc.aide.length||jet()<=0};lab();N.appendChild(hb)}
 function finish(good){over=true;if(hb)hb.remove();R.done=1;store();F.innerHTML=`<div class="fb ${good?'good':'bad'}">${good?'Bravo ! ':'La bonne réponse est montrée. '}${sc.expl}</div>`;N.appendChild(btn('Continuer',next))}
 function tryit(ok,err,e,x){if(over)return;R.t++;if(ok){e.classList.add('good');return finish(true)}
  e.classList.add('bad');if(e.tagName==='BUTTON')e.disabled=true;R.e.push(err);store();
  if(R.t>=3){if(sc.pivot&&!tuto&&!ep.seul)return perdre(sc.pivot);const g=A.querySelector('[data-ok]');if(g)g.classList.add('good');return finish(false)}
  F.innerHTML=`<div class="fb bad">${x||ERR[err]||ERR.hors} Essaie encore.</div>`}
 if(sc.type==='qcm')shuffle(sc.o).forEach(o=>{const b=document.createElement('button');b.className='opt';b.textContent=o.t;if(o.ok)b.dataset.ok=1;b.onclick=()=>tryit(o.ok,o.err,b,o.x);A.appendChild(b)});
 if(sc.type==='image'){A.className='imgs';shuffle(sc.o).forEach(o=>{const b=document.createElement('button');b.className='opt';if(o.ok)b.dataset.ok=1;const w=el('',sc.crop?'face':'');w.appendChild(img(o.img,o.flip?'flip':''));b.appendChild(w);b.onclick=()=>tryit(o.ok,o.err,b);A.appendChild(b)})}
 if(sc.type==='clic'){const x=ep.extraits[sc.ref];A.className='extrait';A.innerHTML=`<small>Texte de ${x.src} – clique sur la bonne partie</small>`;sc.seg.forEach((t,k)=>{const s=document.createElement('span');s.className='seg';s.textContent=t;if(k===sc.ok)s.dataset.ok=1;s.onclick=()=>tryit(k===sc.ok,'ailleurs',s);A.append(s,' ')})}
 if(sc.type==='saisie'){const i=document.createElement('input');i.type='text';i.autocomplete='off';const ok=btn('Valider',()=>{if(!i.value.trim())return;tryit(sc.rep.map(norm).includes(norm(i.value)),'saisie',i)});i.onkeydown=e=>{if(e.key==='Enter')ok.click()};A.append(i,ok);i.focus()}}
/* ---------- bilan : réussites, jetons, et « refaire seul » les questions où l'indice 3 a servi ---------- */
function bilan(){drawStage(null);if(ep.seul){ep=ep.orig;return home()}
 save.done=save.done||{};save.done[ep.id]=1;store();
 const by={},ks=Object.keys(save.res||{}).filter(k=>k.indexOf(ep.id+':')===0);
 ks.forEach(k=>{const r=save.res[k];by[r.c]=by[r.c]||[0,0];by[r.c][1]++;if(r.t<=1&&!r.h)by[r.c][0]++});
 P.innerHTML='<h1>Épisode terminé !</h1><p>Réussites du premier coup, sans coup de pouce :</p>'+Object.keys(by).map(c=>`<div>${COMP[c]} : ${by[c][0]} / ${by[c][1]}<div class="bar"><i style="width:${by[c][0]/by[c][1]*100}%"></i></div></div>`).join('');
 const dur=ks.filter(k=>save.res[k].h3);
 if(dur.length){P.insertAdjacentHTML('beforeend',`<p>Pour ${dur.length} question${dur.length>1?'s':''}, tu as eu besoin du dernier indice de Sauteriot. Tu veux les refaire seul ?</p>`);
  P.appendChild(btn('Refaire seul',()=>{const sc=[];dur.forEach(k=>{const q=ep.scenes.find(s=>ep.id+':'+s.id===k);if(!q)return;const t=ep.scenes.find(s=>s.type==='texte'&&s.ref===q.ref);if(t&&!sc.includes(t))sc.push(t);sc.push(q)});
   ep={...ep,seul:1,orig:ep,scenes:sc};start(ep,0)}))}
 P.appendChild(btn('Retour à l\'accueil',home,1))}
dys(!!save.dys);home();
</script></body></html>
